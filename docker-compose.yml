# Local setup: PostgreSQL + the service.
#
#   cp .env.example .env                                  # set the API keys
#   cp config/kitly-cal.example.yml config/kitly-cal.yml  # set event types and availability
#   docker compose up --build
#
# A stand-in for cal.eu without database, mail or calendar (nothing in it is a real booking):
#
#   docker compose --profile mock up --build mock

services:
  db:
    image: postgres:16-alpine
    ports:
      - "${KITLY_CAL_DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=kitlycal
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kitly-cal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kitlycal"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${KITLY_CAL_PORT:-8081}:8080"
    environment:
      - JAVA_OPTS=-Xmx384m -Xms128m
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/kitlycal
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # API keys, comma-separated, at least 24 characters each
      - KITLY_CAL_API_KEYS=${KITLY_CAL_API_KEYS:-}
      - KITLY_CAL_SANDBOX_API_KEYS=${KITLY_CAL_SANDBOX_API_KEYS:-}
      # Webhook BOOKING_CREATED to the app
      - KITLY_CAL_WEBHOOK_URL=${KITLY_CAL_WEBHOOK_URL:-}
      - KITLY_CAL_SANDBOX_WEBHOOK_URL=${KITLY_CAL_SANDBOX_WEBHOOK_URL:-}
      - KITLY_CAL_WEBHOOK_SECRET=${KITLY_CAL_WEBHOOK_SECRET:-}
    volumes:
      # Event types and availability: config/kitly-cal.yml
      - ./config:/config:ro
    extra_hosts:
      # Lets the container reach an app running on the host (http://host.docker.internal:3000/...).
      - "host.docker.internal:host-gateway"
    networks:
      - kitly-cal-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mock:
    profiles: ["mock"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${KITLY_CAL_MOCK_PORT:-4010}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mock
      - JAVA_OPTS=-Xmx256m
      # Optional: really send the signed webhook to a locally running app.
      - KITLY_CAL_WEBHOOK_URL=${KITLY_CAL_MOCK_WEBHOOK_URL:-https://app.mock/api/cal/webhook}
      - KITLY_CAL_WEBHOOK_SECRET=${KITLY_CAL_WEBHOOK_SECRET:-mock-webhook-secret}
      - KITLY_CAL_MOCK_FORWARD_WEBHOOKS=${KITLY_CAL_MOCK_FORWARD_WEBHOOKS:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  kitly-cal-network:
    driver: bridge

volumes:
  postgres_data:
