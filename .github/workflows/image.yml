name: Image

# Builds the service and publishes it to GitHub Container Registry, so servers that only pull images
# (Hostinger Docker Manager) can run it: ghcr.io/munichdeveloper/kitly-cal:main (and :<sha>).
on:
  push:
    branches: [main, claude/project-thread-a0horz]
    paths: [backend/**, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Tests
        run: mvn -B -q test
        working-directory: backend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "list=${image}:${branch},${image}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
